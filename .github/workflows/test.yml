name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: game_editor_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: server/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: server
        run: pnpm typecheck

      - name: Write server/.env.test for CI
        working-directory: server
        run: |
          cat > .env.test <<'EOF'
          PORT=3001
          JWT_SECRET=ci_test_secret_key
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/game_editor_test_db?schema=public"
          REFRESH_REUSE_GRACE_MS=300
          EOF

      - name: Apply Prisma migrations
        working-directory: server
        run: pnpm test:migrate

      - name: Run tests
        working-directory: server
        run: pnpm test

  client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install client dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        working-directory: client
        run: pnpm build